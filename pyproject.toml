[project]
name = "namespec"
version = "0.1.0a2"
description = "Readable rules for names, metadata, and resource locations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
namespec = "namespec.cli:main"

[project.optional-dependencies]
filesystem = ["pathvalidate>=3.3,<4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/namespec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
